<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mister E AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1020;color:#f7f8ff;font-family:Inter,system-ui,Arial}.wrap{max-width:1160px;margin:auto;padding:26px 18px 60px}header{display:flex;justify-content:space-between}.logo{font-weight:950;font-size:25px}.logo span{color:#8b7cff}.badge{font-size:11px;border:1px solid #343957;padding:7px 10px;border-radius:99px;color:#bfc5df}.hero{margin:32px 0 22px}.hero h1{font-size:clamp(38px,6vw,64px);line-height:.95;letter-spacing:-3px;margin:0 0 12px}.hero p{color:#aeb5d0;font-size:17px;max-width:760px}.layout{display:grid;grid-template-columns:390px 1fr;gap:20px}.panel{background:#151a2d;border:1px solid #292f4b;border-radius:22px;padding:20px}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:12px}.u{border:2px dashed #444c70;border-radius:17px;padding:8px;min-height:245px;text-align:center}.u button{width:100%;height:225px;background:transparent;color:white;border:0;cursor:pointer}.u strong{display:block;font-size:16px;margin:7px}.u small{color:#aeb5d0}.u img{display:none;max-width:100%;max-height:220px;border-radius:10px;margin:auto}.u input{display:none}.replace{display:none!important;height:auto!important;padding:7px!important;background:#292f4b!important;border-radius:8px!important;font-size:10px}label{display:block;color:#aeb5d0;font-size:13px;margin:15px 0 7px}select{width:100%;padding:13px;background:#0f1324;color:white;border:1px solid #343957;border-radius:11px}.go{width:100%;margin-top:15px;padding:15px;background:#8b7cff;color:white;border:0;border-radius:12px;font-weight:900;cursor:pointer}.go:disabled{opacity:.45}.status{font-size:12px;color:#aeb5d0;margin-top:10px;min-height:18px}.results{display:grid;gap:12px}.card{background:#0f1324;border:1px solid #292f4b;border-radius:16px;padding:17px}.card h2{font-size:15px;margin:0 0 11px}.card p,.card li{color:#e8eaf4;line-height:1.55}.card ul{padding-left:20px}.copy{float:right;background:#292f4b;color:white;border:0;border-radius:7px;padding:6px 9px;font-size:10px}.details{display:grid;grid-template-columns:1fr 1fr;gap:7px}.d{background:#151a2d;border-radius:9px;padding:9px}.d b{display:block;font-size:9px;color:#8f97b8;text-transform:uppercase}.d span{font-size:12px}.heroCard{border:1px solid #3b4264;background:#181e36;border-radius:18px;padding:18px}.heroCard .name{font-size:25px;font-weight:900}.heroCard .sub{color:#aeb5d0}.error{color:#ffb7b7}@media(max-width:820px){.layout{grid-template-columns:1fr}}@media(max-width:480px){.uploads{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><div class="logo">MISTER E <span>AI</span></div><div class="badge">CARD CONTENT ENGINE</div></header>
<section class="hero"><h1>Know the card.<br>Tell the story.</h1><p>Upload the front and back and Mister E AI turns the card into information, history, listing copy, social ideas, hashtags, and content concepts.</p></section>
<div class="layout"><section class="panel"><div class="uploads">
<div class="u"><button id="fp" type="button">🃏<strong>CARD FRONT</strong><small>Required • choose photo</small></button><input id="front" type="file" accept="image/*"><img id="fi"><button id="fr" class="replace" type="button">Replace front</button></div>
<div class="u"><button id="bp" type="button">🔄<strong>CARD BACK</strong><small>Recommended • choose photo</small></button><input id="back" type="file" accept="image/*"><img id="bi"><button id="br" class="replace" type="button">Replace back</button></div></div>
<label>Sport / Category</label><select id="sport"><option>Football</option><option>Basketball</option><option>Baseball</option><option>Hockey</option><option>Wrestling</option><option>MMA</option><option>Pokémon / Trading Card</option><option>Other</option></select>
<button id="go" class="go" disabled>✨ ANALYZE MY CARD</button><div id="status" class="status"></div></section>
<section class="panel"><div id="results" class="results"><div class="card"><h2>🃏 Your Card</h2><p>Upload the front to get started.</p></div></div></section></div></div>
<script>
const $=x=>document.getElementById(x);let front=null,back=null;
function wire(input,pick,replace,img,setter){$(pick).onclick=()=>$(input).click();$(replace).onclick=()=>$(input).click();$(input).onchange=()=>{const f=$(input).files[0];if(!f)return;setter(f);const r=new FileReader();r.onload=e=>{$(img).src=e.target.result;$(img).style.display="block";$(pick).style.display="none";$(replace).style.display="block"};r.readAsDataURL(f);$("go").disabled=!front}}
wire("front","fp","fr","fi",f=>front=f);wire("back","bp","br","bi",f=>back=f);
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}function block(t,b){return `<div class="card"><button class="copy" onclick="navigator.clipboard.writeText(this.parentElement.innerText);this.innerText='COPIED'">COPY</button><h2>${t}</h2>${b}</div>`}function p(s){return `<p>${esc(s)}</p>`}function list(a){return `<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}
$("go").onclick=async()=>{const fd=new FormData();fd.append("front",front);if(back)fd.append("back",back);fd.append("sport",$("sport").value);$("go").disabled=true;$("status").innerText="✨ Reading the card and building the story…";try{const r=await fetch("/api/analyze",{method:"POST",body:fd}),d=await r.json();if(!r.ok)throw Error(d.error);const c=d.card_information,rows=[["Sport",c.sport],["Player / Character",c.player_or_character],["Team / Franchise",c.team_or_franchise],["Year",c.year],["Manufacturer",c.manufacturer],["Set",c.set_name],["Card #",c.card_number],["Rookie / First",c.rookie_or_first],["Parallel / Variation",c.parallel_or_variation],["Serial #",c.serial_number],["Autograph",c.autograph],["Relic",c.relic],["Confidence",c.confidence]];const details='<div class="details">'+rows.map(x=>`<div class="d"><b>${x[0]}</b><span>${esc(x[1])}</span></div>`).join("")+'</div>'+p("Other visible details: "+c.other_visible_details);$("results").innerHTML=`<div class="heroCard"><div class="name">${esc(c.player_or_character)}</div><div class="sub">${esc(c.year)} • ${esc(c.manufacturer)} • ${esc(c.set_name)} • ${esc(c.card_number)}</div></div>`+block("1. 🃏 Card Information",details)+block("2. 📚 History of the Card & Athlete / Character",p(d.history))+block("3. 🛒 Listing Description",p(d.listing_description))+block("4. 📱 Social Media Post Ideas",list(d.social_media_post_ideas))+block("5. #️⃣ Hashtags",p(d.hashtags))+block("6. 💡 Content Ideas",list(d.content_ideas));$("status").innerText="✅ Your six-part content package is ready."}catch(e){$("status").innerHTML='<span class="error">❌ '+esc(e.message)+'</span>'}finally{$("go").disabled=!front}};
</script></body></html>
