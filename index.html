<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mister E AI V4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1020;color:#f7f8ff;font-family:Inter,system-ui,Arial}.wrap{max-width:1120px;margin:auto;padding:25px 18px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.logo{font-weight:950;font-size:25px}.logo span{color:#8b7cff}.badge{font-size:11px;color:#bfc5df;border:1px solid #343957;padding:7px 10px;border-radius:99px}
h1{font-size:clamp(36px,6vw,62px);line-height:.96;letter-spacing:-3px;margin:0 0 12px}.hero p{color:#aeb5d0;font-size:17px;max-width:730px}.grid{display:grid;grid-template-columns:410px 1fr;gap:20px;margin-top:22px}
.panel{background:#151a2d;border:1px solid #292f4b;border-radius:22px;padding:20px}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:12px}.upload{border:2px dashed #444c70;border-radius:17px;min-height:250px;padding:8px;position:relative}.upload:hover{border-color:#8b7cff}
.pick{width:100%;height:230px;background:transparent;color:#fff;border:0;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;margin:0}.pick strong{display:block;font-size:17px;margin-bottom:6px}.pick small{color:#aeb5d0}.preview{display:none;max-width:100%;max-height:230px;margin:auto;border-radius:10px}.replace{display:none;position:absolute;bottom:7px;left:7px;right:7px;padding:7px;font-size:10px;background:#292f4b}
input[type=file]{display:none}label.sel{display:block;color:#aeb5d0;font-size:13px;margin:15px 0 7px}select{width:100%;padding:13px;border-radius:11px;background:#0f1324;color:#fff;border:1px solid #343957}
.analyze{width:100%;margin-top:15px;background:#8b7cff;color:#fff;border:0;border-radius:12px;padding:15px;font-weight:900;font-size:15px;cursor:pointer}.analyze:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:12px;color:#aeb5d0;margin-top:11px;min-height:18px}.result{display:grid;gap:12px}.card{background:#0f1324;border:1px solid #292f4b;border-radius:16px;padding:16px}.card h3{margin:0 0 10px;color:#9ea6c5;font-size:12px;text-transform:uppercase;letter-spacing:1px}.card p{margin:0;line-height:1.55;white-space:pre-wrap}.copy{float:right;border:0;background:#292f4b;color:#fff;border-radius:7px;padding:6px 9px;font-size:10px;cursor:pointer}.details{display:grid;grid-template-columns:1fr 1fr;gap:7px}.d{background:#151a2d;border-radius:9px;padding:9px}.d b{display:block;color:#8f97b8;font-size:9px;text-transform:uppercase}.d span{font-size:12px}.error{color:#ffb7b7}
@media(max-width:820px){.grid{grid-template-columns:1fr}}@media(max-width:470px){.uploads{grid-template-columns:1fr}.upload{min-height:205px}.pick{height:190px}.preview{max-height:190px}}
</style></head>
<body><div class="wrap"><header><div class="logo">MISTER E <span>AI</span></div><div class="badge">V4 • REAL VISION</div></header>
<div class="hero"><h1>Show it both ways.</h1><p>Upload the front and back of a sports card. V4 sends both images to the AI vision model and turns the confirmed details into creator-ready content.</p></div>
<div class="grid"><section class="panel"><div class="uploads">
<div class="upload"><button class="pick" id="frontPick" type="button"><span>🃏<strong>CARD FRONT</strong><small>Tap to choose image</small></span></button><input id="front" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><img id="frontImg" class="preview"><button id="frontReplace" class="replace" type="button">Replace front</button></div>
<div class="upload"><button class="pick" id="backPick" type="button"><span>🔄<strong>CARD BACK</strong><small>Recommended</small></span></button><input id="back" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><img id="backImg" class="preview"><button id="backReplace" class="replace" type="button">Replace back</button></div>
</div>
<label class="sel">Sport</label><select id="sport"><option>Football</option><option>Basketball</option><option>Baseball</option><option>Hockey</option><option>Wrestling</option><option>MMA</option><option>Other</option></select>
<button id="go" class="analyze" disabled>✨ ANALYZE CARD</button><div id="status" class="status"></div>
</section><section class="panel"><div id="result" class="result"><div class="card"><h3>🔎 Card Profile</h3><p>Choose a front image to begin.</p></div></div></section></div></div>
<script>
const $=id=>document.getElementById(id);let frontFile=null,backFile=null;
function setup(input,pick,replace,img,setter){$(pick).onclick=()=>$(input).click();$(replace).onclick=()=>$(input).click();$(input).onchange=()=>{const f=$(input).files[0];if(!f)return;setter(f);const reader=new FileReader();reader.onload=e=>{$(img).src=e.target.result;$(img).style.display="block";$(pick).style.display="none";$(replace).style.display="block"};reader.readAsDataURL(f);$("go").disabled=!frontFile};}
setup("front","frontPick","frontReplace","frontImg",f=>frontFile=f);setup("back","backPick","backReplace","backImg",f=>backFile=f);
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function textBox(title,text){return `<div class="card"><button class="copy" onclick="navigator.clipboard.writeText(this.parentElement.querySelector('p').innerText);this.innerText='COPIED'">COPY</button><h3>${title}</h3><p>${esc(text)}</p></div>`}
$("go").onclick=async()=>{const fd=new FormData();fd.append("front",frontFile);if(backFile)fd.append("back",backFile);fd.append("sport",$("sport").value);$("go").disabled=true;$("status").innerText="✨ Sending both sides to the AI…";
try{const response=await fetch("/api/analyze",{method:"POST",body:fd});const d=await response.json();if(!response.ok)throw new Error(d.error||"Analysis failed.");
const c=d.card;const rows=[["Sport",c.sport],["Player",c.player],["Team",c.team],["Year",c.year],["Manufacturer",c.manufacturer],["Set",c.set_name],["Card #",c.card_number],["Rookie",c.rookie],["Parallel",c.parallel],["Serial",c.serial_number],["Autograph",c.autograph],["Relic",c.relic],["Confidence",c.confidence]];
let profile='<div class="details">'+rows.map(r=>`<div class="d"><b>${r[0]}</b><span>${esc(r[1])}</span></div>`).join("")+'</div><p style="margin-top:12px"><b>Notable:</b> '+esc(c.notable_details)+'<br><br><b>Visible condition:</b> '+esc(c.visible_condition_notes)+'</p>';
$("result").innerHTML=textBox("🔎 Card Profile",profile.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim())+textBox("📱 Social Post",d.social_post)+textBox("🎬 Video Script",d.video_script)+textBox("🛒 Listing Description",d.listing_description)+textBox("#️⃣ Hashtags",d.hashtags)+textBox("💡 Content Ideas",d.content_ideas.join("\\n\\n"));$("status").innerText="✅ Analysis complete.";
}catch(e){$("status").innerHTML='<span class="error">❌ '+esc(e.message)+'</span>'}finally{$("go").disabled=!frontFile}};
</script></body></html>
